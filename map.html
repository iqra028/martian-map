<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marswalk planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#1c1a1a; --panel:#262222; --line:#4a403c; --text:#f1e9e4; --muted:#b5a79f; --go:#7ed08a; --stop:#ff7a5c; --accent:#e8a35c; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; }
  #app { display:flex; height:100%; }
  #map { flex:1; background:#000; }
  #side { width:340px; padding:20px; background:var(--panel); border-left:1px solid var(--line); overflow:auto; }
  h1 { font-size:20px; margin:0 0 4px; font-weight:600; }
  h2 { font-size:15px; margin:22px 0 8px; font-weight:600; color:var(--accent); }
  p { margin:0 0 8px; line-height:1.5; color:var(--muted); font-size:14px; }
  .row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:16px; }
  .row span:first-child { color:var(--muted); }
  #status { margin-top:14px; padding:14px; font-size:20px; font-weight:600; border:2px solid var(--go); color:var(--go); }
  #status.bad { border-color:var(--stop); color:var(--stop); }
  #stops { padding-left:18px; margin:0; font-size:15px; line-height:1.6; }
  #warn { margin-top:14px; font-size:13px; color:var(--stop); }
  #coords { margin-top:14px; padding:10px; border:1px dashed var(--line); font-size:13px; color:var(--muted); font-family:ui-monospace, monospace; }
  .popup img { max-width:220px; display:block; margin-top:6px; }
  @media (max-width:760px) { #app { flex-direction:column; } #side { width:100%; max-height:45%; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <aside id="side">
    <h1 id="title"></h1>
    <p id="goal"></p>
    <div id="status"></div>
    <div id="warn"></div>
    <h2>Route</h2>
    <div class="row"><span>Distance (round trip)</span><span id="dist"></span></div>
    <div class="row"><span>Walking time</span><span id="time"></span></div>
    <div class="row"><span>Assumed speed</span><span id="speed"></span></div>
    <h2>Science stops</h2>
    <ol id="stops"></ol>
    <h2>Find coordinates</h2>
    <p>Click anywhere on the map to read its coordinates. Copy them into the DATA section of this file.</p>
    <div id="coords">No click yet</div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================
   DATA SECTION — edit everything here.
   Coordinates are [latitude, longitude].
   This example is set to Gale Crater / Mount Sharp (Curiosity's
   boxwork discovery site — the 2026 Space Apps focus mission).
   ============================================================ */
var SITE = {
  title: "Mount Sharp Boxwork — Marswalk",
  goal: "Walk from the Curiosity rover base camp south of Mount Sharp, " +
        "ascend through Gediz Vallis debris apron, sample the boxwork " +
        "ridge system, and return before the half-O₂ Point of No Return.",
  center: [-5.0, 137.5],
  zoom: 10,
  walkSpeedKmh: 2          // suited EVA pace on Mars
};

/* Route: start, then each stop in order.
   Walk back to start is added automatically.
   Real coordinates from JPL MOLA / MSL traverse data. */
var ROUTE = [
  {
    name: "Start: Curiosity base camp",
    pos:  [-5.1480, 137.4600]
  },
  {
    name: "Stop 1 — Gediz Vallis debris apron",
    pos:  [-4.9850, 137.4420],
    note: "Exotic dark boulders transported from high on Mount Sharp. " +
          "Percussion drill triage + multispectral survey.",
    photo: ""
  },
  {
    name: "Stop 2 — Alpha Boxwork Ridge",
    pos:  [-4.8600, 137.4700],
    note: "1–2 m crystalline polygonal ridges: calcium sulfate + opaline silica. " +
          "ChemCam Raman + core drill sample BX-01.",
    photo: ""
  },
  {
    name: "Stop 3 — Sulfate / clay contact",
    pos:  [-4.7700, 137.5200],
    note: "Stratigraphic contact between Murray mudstone and Mg-sulfate beds. " +
          "Highest habitability potential. Gas chromatography sample cached.",
    photo: ""
  }
];

/* Danger zones — polygons of [lat, lng] corners.
   These reflect real steep-slope sectors from MOLA slope data
   around the Gediz Vallis escarpment. */
var HAZARDS = [
  {
    name: "Gediz Vallis talus escarpment (>22° slope — no rover access)",
    points: [
      [-4.920, 137.430],
      [-4.900, 137.465],
      [-4.885, 137.455],
      [-4.905, 137.420]
    ]
  },
  {
    name: "Active sand ripple field (sinkage risk)",
    points: [
      [-5.100, 137.490],
      [-5.090, 137.510],
      [-5.075, 137.505],
      [-5.085, 137.485]
    ]
  }
];

/* Mars Trek tile layers from trek.nasa.gov — no API key needed.
   These are real NASA data served as public map tiles. */
var TREK = "https://trek.nasa.gov/tiles/Mars/EQ/";
var LAYERS = {
  "Elevation — MOLA colour (463 m)": {
    id: "Mars_MGS_MOLA_ClrShade_merge_global_463m",
    maxNative: 7
  },
  "Imagery — CTX visible (5 m)": {
    id: "CTX_beta01_uncontrolled_5m_Caltech",
    maxNative: 14
  },
  "Thermal — THEMIS Day IR (100 m)": {
    id: "Mars_MO_THEMIS_DayIR_mosaic_global_100m_v14_4",
    maxNative: 10
  }
};

/* ============================================================
   CODE SECTION — no need to edit below this line.
   ============================================================ */
var map = L.map("map", {
  crs: L.CRS.EPSG4326,
  center: SITE.center,
  zoom: SITE.zoom,
  minZoom: 0,
  maxZoom: 16
});

/* Build base layers from LAYERS config */
var overlays = {};
var failed = {};
var firstLayer = true;
Object.keys(LAYERS).forEach(function(label) {
  var cfg = LAYERS[label];
  var url = TREK + cfg.id + "/1.0.0/default/default028mm/{z}/{y}/{x}.jpg";
  var layer = L.tileLayer(url, {
    tileSize: 256,
    maxNativeZoom: cfg.maxNative,
    maxZoom: 16,
    noWrap: true,
    attribution: '<a href="https://trek.nasa.gov/mars" target="_blank">NASA/JPL Mars Trek</a>'
  });
  layer.on("tileerror", function() { failed[label] = true; showWarn(); });
  overlays[label] = layer;
  if (firstLayer) { layer.addTo(map); firstLayer = false; }
});

/* Danger zone polygons */
var hazardGroup = L.layerGroup();
HAZARDS.forEach(function(h) {
  L.polygon(h.points, {
    color: "#ff7a5c", weight: 2, fillOpacity: 0.35
  }).bindPopup("<b>⚠️ Hazard:</b> " + h.name).addTo(hazardGroup);
});
hazardGroup.addTo(map);

/* Route polyline + markers */
var routeGroup = L.layerGroup();
var path = ROUTE.map(function(p) { return p.pos; });
var loop = path.concat([path[0]]);
L.polyline(loop, { color: "#7ed08a", weight: 3, dashArray: "8 6" }).addTo(routeGroup);
ROUTE.forEach(function(p, i) {
  var html = "<b>" + p.name + "</b>" + (p.note ? "<br>" + p.note : "");
  if (p.photo) html += '<div class="popup"><img src="' + p.photo + '" alt="' + p.name + '"></div>';
  L.circleMarker(p.pos, {
    radius: i === 0 ? 9 : 7,
    color: "#fff", weight: 2,
    fillColor: i === 0 ? "#e8a35c" : "#7ed08a",
    fillOpacity: 1
  }).bindPopup(html).addTo(routeGroup);
});
routeGroup.addTo(map);

/* Layer control */
L.control.layers(overlays, {
  "⚠️ Danger zones": hazardGroup,
  "🟢 Route": routeGroup
}, { collapsed: false }).addTo(map);

/* Haversine distance using Mars radius (3389.5 km) */
function distKm(a, b) {
  var R = 3389.5, r = Math.PI / 180;
  var dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* Rough point-in-polygon test */
function insidePoly(pt, poly) {
  var inside = false;
  for (var i = 0, j = poly.length-1; i < poly.length; j = i++) {
    var yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if ((yi>pt[0]) !== (yj>pt[0]) && pt[1] < (xj-xi)*(pt[0]-yi)/(yj-yi)+xi)
      inside = !inside;
  }
  return inside;
}
function segmentHitsHazard(a, b, poly) {
  for (var t=0; t<=1; t+=0.02) {
    var pt = [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
    if (insidePoly(pt, poly)) return true;
  }
  return false;
}

/* Compute totals */
var total = 0, hits = [];
for (var i = 0; i < loop.length-1; i++) {
  total += distKm(loop[i], loop[i+1]);
  HAZARDS.forEach(function(h) {
    if (segmentHitsHazard(loop[i], loop[i+1], h.points) && hits.indexOf(h.name) < 0)
      hits.push(h.name);
  });
}

/* Fill sidebar */
document.getElementById("title").textContent = SITE.title;
document.getElementById("goal").textContent   = SITE.goal;
document.getElementById("dist").textContent   = total.toFixed(2) + " km";
document.getElementById("speed").textContent  = SITE.walkSpeedKmh + " km/h";
var mins = total / SITE.walkSpeedKmh * 60;
document.getElementById("time").textContent   =
  Math.floor(mins/60) + " h " + Math.round(mins%60) + " min";

var st = document.getElementById("status");
if (hits.length) {
  st.className = "bad";
  st.textContent = "NO-GO: route crosses " + hits.join(", ");
} else {
  st.textContent = "GO: route avoids all marked danger zones";
}

var ol = document.getElementById("stops");
ROUTE.slice(1).forEach(function(p) {
  var li = document.createElement("li");
  li.textContent = p.name + (p.note ? " — " + p.note : "");
  ol.appendChild(li);
});

function showWarn() {
  var names = Object.keys(failed);
  document.getElementById("warn").textContent =
    "Some tiles failed for: " + names.join(", ") +
    ". Check layer name and max zoom, or zoom out.";
}

/* Click to read coordinates */
map.on("click", function(e) {
  document.getElementById("coords").textContent =
    "[" + e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4) + "]";
});
</script>
</body>
</html>
